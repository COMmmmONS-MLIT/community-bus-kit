<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{common/layout}"
      th:with="title='運行回数出力'">
<body>
<!-- start: contents -->
<div layout:fragment="main_contents" th:object="${operatingReportListsExcelForm}">
    <!-- PAGE CONTENT WRAPPER -->
    <div class="page-content-wrap">
        <div class="row">
            <div class="col-md-12">
                <div class="panel panel-default">
                    <form method="post" th:action="@{#}" class="form-horizontal">
                        <div class="panel-heading">
                            <h3 class="panel-title">
                                <strong>運行回数出力</strong>
                            </h3>
                        </div>
                        <!-- START メッセージ表示部 -->
                        <div th:replace="~{common/message :: common_message_box('success',${successMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('danger',${errorMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('warning',${warningMessages})}"></div>
                        <!-- END メッセージ表示部 -->
                        <div class="panel-body">
                            <div class="row">
                                <div class="col-md-9">
                                    <div class="form-group">
                                        <label style="width: 150px" class="col-md-1 control-label ichiran-label"> <span class="badge badge-danger require-txt">必須</span>
                                            <span class="form-item-name">路線</span>
                                        </label>
                                        <div class="col-md-9">
                                            <select id="rosenSelect" class="form-control select2" th:field="*{rosenId}"  th:classappend="${#fields.hasErrors('serviceStartDate')} ? 'error' : ''">
                                                <option value="">------------</option>
                                                <option th:each="item : ${linesList}" th:value="${item.rosenId}"
                                                        th:text="${item.rosenName}">
                                                </option>
                                            </select>
                                            <p th:if="${#fields.hasErrors('rosenId')}" th:errors="*{rosenId}" class="text-danger" />
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label style="width: 150px" class="col-md-1 control-label ichiran-label"><span class="badge badge-danger require-txt">必須</span>
                                            <span class="form-item-name">便ダイヤ改正日</span>
                                        </label>
                                        <div class="col-md-9">
                                            <select id="serviceStartDate" class="form-control select2" th:field="*{serviceStartDate}"
                                                th:attr="data-selected=*{serviceStartDate}" th:classappend="${#fields.hasErrors('serviceStartDate')} ? 'error' : ''">
                                                <option value="">------------</option>
                                            </select>
                                            <p th:if="${#fields.hasErrors('serviceStartDate')}" th:errors="*{serviceStartDate}" class="text-danger" />
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label style="width: 150px" class="col-md-1 control-label"><span class="badge badge-danger"></span><span class="badge badge-danger require-txt">必須</span>
                                            <span class="form-item-name">運行期間</span></label>
                                        <div class="col-md-9">
                                            <div class="d-flex align-items-center">
                                                <input class="form-control w-auto" type="month" th:field="*{serviceStartMonth}" max="9999-12-31"
                                                       th:value="${#strings.isEmpty(serviceStartMonth) ? #dates.format(#dates.createNow(),'yyyy-MM') : serviceStartMonth}"
                                                       th:classappend="${#fields.hasErrors('serviceStartMonth')} ? 'error' : ''" />
                                                <span class="mx-2"> ～ </span>
                                                <input class="form-control w-auto" type="month" th:field="*{serviceEndMonth}" max="9999-12-31"
                                                       th:value="${#strings.isEmpty(serviceEndMonth) ? #dates.format(#dates.createNow(),'yyyy-MM') : serviceEndMonth}"
                                                       th:classappend="${#fields.hasErrors('serviceEndMonth')} ? 'error' : ''">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="panel-footer">
                            <div style="display: flex;" class="pull-right">
                                <button th:if="${downloadFlag}"  type="submit" style="margin-left: 10px;" class="btn btn-primary btn-submit"
                                        th:formaction="@{/record/operatingReport/downloadExcel}">
                                    抽出する
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <th:block th:insert="~{common/script :: common_script}"></th:block>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var allDaiyaDateList = /*[[${daiyaDateList}]]*/ [];
        /*]]>*/
    </script>
    <script th:src="@{/js/record/operatingReport/lists.js}"></script>
</div>
<!-- END PAGE CONTENT WRAPPER -->
</body>
</html>
