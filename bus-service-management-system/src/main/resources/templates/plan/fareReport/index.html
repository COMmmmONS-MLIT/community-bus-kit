<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{common/layout}"
      th:with="title='運賃表出力'">
<body>
<!-- start: contents -->
<div layout:fragment="main_contents" th:object="${fareReportListsExcelForm}">
    <!-- PAGE CONTENT WRAPPER -->
    <div class="page-content-wrap">
        <div class="row">
            <div class="col-md-12">
                <div class="panel panel-default">
                    <form method="post" th:action="@{#}" class="form-horizontal">
                        <div class="panel-heading">
                            <h3 class="panel-title">
                                <strong>運賃表出力</strong>
                            </h3>
                        </div>
                        <!-- START メッセージ表示部 -->
                        <div th:replace="~{common/message :: common_message_box('success',${successMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('danger',${errorMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('warning',${warningMessages})}"></div>
                        <!-- END メッセージ表示部 -->
                        <div class="panel-body">
                            <div class="row">
                                <div class="col-md-9">
                                    <div class="form-group">
                                        <label style="width: 150px" class="col-md-1 control-label ichiran-label"> <span
                                                class="badge badge-danger require-txt">必須</span>
                                            <span class="form-item-name">路線</span>
                                        </label>
                                        <div class="col-md-9">
                                            <select id="rosenSelect" class="form-control select2" th:field="*{rosenId}"
                                                    th:classappend="${#fields.hasErrors('serviceStartDate')} ? 'error' : ''">
                                                <option value="">------------</option>
                                                <option th:each="item : ${linesList}" th:value="${item.rosenId}"
                                                        th:text="${item.rosenName}">
                                                </option>
                                            </select>
                                            <p th:if="${#fields.hasErrors('rosenId')}" th:errors="*{rosenId}"
                                               class="text-danger"/>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label style="width: 150px" class="col-md-1 control-label ichiran-label"><span
                                                class="badge badge-danger require-txt">必須</span>
                                            <span class="form-item-name">運賃改定日</span>
                                        </label>
                                        <div class="col-md-9">
                                            <select id="serviceStartDate" class="form-control select2"
                                                    th:field="*{chargeRevisionId}"
                                                    th:attr="data-selected=*{chargeRevisionId}"
                                                    th:classappend="${#fields.hasErrors('chargeRevisionId')} ? 'error' : ''">
                                                <option value="">------------</option>
                                            </select>
                                            <p th:if="${#fields.hasErrors('chargeRevisionId')}"
                                               th:errors="*{chargeRevisionId}" class="text-danger"/>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="panel-footer">
                            <div style="display: flex;" class="pull-right">
                                <button th:if="${downloadFlag}" type="submit" style="margin-left: 10px;" class="btn btn-primary btn-submit"
                                        th:formaction="@{/plan/fareReport/downloadExcel}">
                                    抽出する
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <th:block th:insert="~{common/script :: common_script}"></th:block>
    <script th:inline="javascript">
        /*<![CDATA[*/
        var allRevisionDateList = /*[[${chargeRevisionDateList}]]*/ [];
        /*]]>*/
    </script>
    <script th:src="@{/js/plan/fareReport/lists.js}"></script>
</div>
<!-- END PAGE CONTENT WRAPPER -->
</body>
</html>
