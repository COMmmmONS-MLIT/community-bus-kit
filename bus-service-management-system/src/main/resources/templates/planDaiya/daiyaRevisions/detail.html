<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{common/layout}" th:with="title='便ダイヤ改正登録'">

<body>
<!-- start: contents -->
<div layout:fragment="main_contents" th:object="${displayForm}">
    <!-- PAGE CONTENT WRAPPER -->
    <div class="page-content-wrap">
        <div class="row">
            <div class="col-md-12">
                <form method="post" class="form-horizontal" id="confirmForm" th:action="@{/planDaiya/daiyaRevisions/detail/confirm/}"
                      onkeydown="return event.key !== 'Enter';">
                    <input type="hidden" name="originSessionKey" th:value="*{sessionKey}">
                    <input type="hidden" th:field="*{page}">
                    <input type="hidden" th:field="*{daiyaRevisionId}">
                    <input type="hidden" th:field="*{serviceEndDate}">
                    <input type="hidden" th:field="*{dispMode}">
                    <div class="panel panel-default">
                        <div class="panel-heading">
                            <h3 class="panel-title">
                                <strong th:text="便ダイヤ改正__*{dispMode.text}__">便ダイヤ改正</strong>
                            </h3>
                        </div>
                        <!-- START メッセージ表示部 -->
                        <div th:replace="~{common/message :: common_message_box('success',${successMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('danger',${errorMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('warning',${warningMessages})}"></div>
                        <!-- END メッセージ表示部 -->
                        <div class="panel-body">
                            <div class="form-group">
                                <label class="col-md-1 control-label" style="width: 170px;">
                                    <span class="badge badge-danger require-txt">必須</span>
                                    <span class="form-item-name">路線名</span>
                                </label>
                                <div class="col-md-9">
                                    <select class="form-control select2" th:field="*{rosenId}">
                                        <option value="">-------</option>
                                        <option th:each="item : ${linesList}" th:value="${item.rosenId}" th:text="${item.rosenName}">
                                        </option>
                                    </select>
                                    <p th:if="${#fields.hasErrors('rosenId')}" th:errors="*{rosenId}" class="text-danger"></p>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-1 control-label" style="width: 170px;">
                                    <span class="badge badge-danger require-txt">必須</span>
                                    <span class="form-item-name">運行年月開始日</span>
                                </label>
                                <div class="col-md-10">
                                    <div class="d-flex align-items-center">
                                        <input class="form-control w-auto" type="date" th:field="*{serviceStartDate}" max="9999-12-31" th:classappend="${#fields.hasErrors('serviceStartDate')} ? 'error' : ''"/>
                                    </div>
                                    <p th:if="${#fields.hasErrors('serviceStartDate')}" th:errors="*{serviceStartDate}" class="text-danger"></p>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-1 control-label" style="width: 170px;">
                                    <span class="badge badge-danger require-txt">必須</span>
                                    <span class="form-item-name" >ダイヤ改正理由</span>
                                </label>
                                <div class="col-md-10">
                                    <div class="input-group col-md-11 div-flex">
                                        <input type="text" name="daiyaRevisionName" maxlength="50" th:value="*{daiyaRevisionName}" class="form-control" style="width: 300px;" th:classappend="${#fields.hasErrors('daiyaRevisionName')} ? 'error' : ''" />
                                        <button type="button" class="btn btn-default btn-xs help-toggle" onclick="toggleHelp('daiyaRevisionName-help', this)" >主な改正内容を記入... ＞ </button>
                                    </div>
                                    <p th:if="${#fields.hasErrors('daiyaRevisionName')}" th:errors="*{daiyaRevisionName}" class="text-danger" />
                                    <div class="form-group">
                                        <div class="alert alert-info" id="daiyaRevisionName-help"
                                             style="display:none; margin:10px 0 0 15px; max-width:600px;">
                                            主な改正内容を記入
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="panel-footer" style="text-align: right;">
                            <a th:href="'/planDaiya/daiyaRevisions/' + *{page} + '/'" class=" btn btn-default">戻る</a>
                            <button type="button" id="confirm" class="btn btn-primary pull-right double-click" style="margin-left: 5px">確認</button>
                        </div>
                    </div>
                    <div th:insert="~{common/modal :: passReissueDialog}" th:remove="tag"></div>
                </form>
            </div>
        </div>
        <th:block th:insert="~{common/script :: common_script}"></th:block>
    </div>
    <!-- END PAGE CONTENT WRAPPER -->
</div>
<!-- end: contents -->
</body>
</html>
