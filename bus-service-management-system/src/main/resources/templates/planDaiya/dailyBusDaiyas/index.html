<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{common/layout}" th:with="title='日毎便ダイヤ管理'">

<body>
<!-- start: contents -->
<div layout:fragment="main_contents">
    <!-- PAGE CONTENT WRAPPER -->
    <div class="page-content-wrap">
        <div class="row">
            <div class="col-md-12">
                <form method="post" th:action="@{#}" class="form-horizontal" th:object="${dailyBusDaiyasSearchForm}"
                      onkeydown="return event.key !== 'Enter';">
                    <div class="panel panel-default">
                        <div class="panel-heading">
                            <h3 class="panel-title">
                                <strong>日毎便ダイヤ一覧</strong>
                            </h3>
                        </div>
                        <!-- START メッセージ表示部 -->
                        <div th:replace="~{common/message :: common_message_box('success',${successMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('danger',${errorMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('warning',${warningMessages})}"></div>
                        <!-- END メッセージ表示部 -->
                        <div class="panel-body">
                            <div class="form-group">
                                <label class="col-md-1 control-label"> <span class="badge badge-danger"></span>
                                    <span class="form-item-name">路線</span>
                                </label>
                                <div class="col-md-9">
                                    <select class="form-control select2" th:field="*{searchRosenId}" id="rosenSelect">
                                        <option value="">-------</option>
                                        <option th:each="item : ${linesList}" th:value="${item.rosenId}" th:text="${item.rosenName}"></option>
                                    </select>
                                    <p th:if="${#fields.hasErrors('searchRosenId')}" th:errors="*{searchRosenId}" class="text-danger"></p>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-1 control-label">
                                    <span class="badge badge-danger"></span>
                                    <span class="form-item-name">運行期間</span>
                                </label>
                                <div class="col-md-9">
                                    <div class="d-flex align-items-center">
                                        <input class="form-control w-auto" type="date" id="serviceStartDate"
                                               th:field="*{searchServiceStartDate}" max="9999-12-31"
                                               th:classappend="${#fields.hasErrors('searchServiceStartDate')} ? 'error' : ''" />
                                        <span class="mx-2"> ～ </span>
                                        <input class="form-control w-auto" type="date" id="serviceEndDate"
                                               th:field="*{searchServiceEndDate}" max="9999-12-31"
                                               th:classappend="${#fields.hasErrors('searchServiceEndDate')} ? 'error' : ''" />
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-1 control-label">
                                    <span class="badge badge-danger"></span>
                                    <span class="form-item-name">始発出発時刻</span>
                                </label>
                                <div class="col-md-9">
                                    <div class="d-flex align-items-center">
                                        <input type="text" class="form-control w-auto" maxlength="4" id="busStopDepartureTimeStart"
                                           th:field="*{searchBusStopDepartureTimeStart}" style="width: 80px;"
                                           th:classappend="${#fields.hasErrors('searchBusStopDepartureTimeStart')} ? 'error' : ''"/>
                                        <span class="mx-2" style="margin-top: 5px;"> ～ </span>
                                        <input type="text" class="form-control w-auto" maxlength="4" id="busStopDepartureTimeEnd"
                                               th:field="*{searchBusStopDepartureTimeEnd}" style="width: 80px;"
                                               th:classappend="${#fields.hasErrors('searchBusStopDepartureTimeEnd')} ? 'error' : ''"/>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-1 control-label"><span class="badge badge-danger"></span>
                                    <span class="form-item-name">運休フラグ</span>
                                </label>
                                <div class="col-md-9">
                                    <div class="radio col-md-12">
                                        <input type="radio" name="salesCancelFlg" th:id="searchSalesCancelFlg__0__" th:value="0" th:checked="*{searchSalesCancelFlg eq 0}" th:field="*{searchSalesCancelFlg}"/>
                                        <label class="inner-title" th:for="searchSalesCancelFlg__0__" th:text="通常運行"></label>
                                        <input type="radio" name="salesCancelFlg" th:id="searchSalesCancelFlg__1__" th:value="1" th:checked="*{searchSalesCancelFlg eq 1}" th:field="*{searchSalesCancelFlg}"/>
                                        <label class="inner-title" th:for="searchSalesCancelFlg__1__" th:text="運休便"></label>
                                    </div>
                                    <p th:if="${#fields.hasErrors('searchSalesCancelFlg')}" th:errors="*{searchSalesCancelFlg}" class="text-danger"></p>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-1 control-label"> <span class="badge badge-danger"></span>
                                    <span class="form-item-name">便名</span>
                                </label>
                                <div class="col-md-9">
                                    <select class="form-control select2" th:field="*{searchBusServiceId}" th:attr="data-initial-bus=*{searchBusServiceId}" id="busServiceSelect">
                                        <option value="">-------</option>
                                    </select>
                                    <p th:if="${#fields.hasErrors('searchBusServiceId')}" th:errors="*{searchBusServiceId}" class="text-danger"></p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="panel-footer">
                        <div style="display: flex;" class="pull-right">
                            <button type="submit" style="margin-left: 10px;" class="btn btn-primary btn-submit" th:formaction="@{/planDaiya/dailyBusDaiyas/}">
                                <i class="fa fa-search" aria-hidden="true"></i>検索
                            </button>
                        </div>
                    </div>
                </form>
                <div class="panel panel-default">
                    <div class="panel-body">
                        <table class="table table-striped table-bordered">
                            <thead>
                            <tr role="row">
                                <th style="width: 120px;">ID</th>
                                <th style="width: 300px;">路線名</th>
                                <th style="width: 500px;">往復区分</th>
                                <th style="width: 500px;">系統名</th>
                                <th style="width: 200px;">運行年月日</th>
                                <th style="width: 100px;">操作</th>
                            </tr>
                            </thead>
                            <tbody th:if="${pager} neq null">
                            <tr th:each="dailyBusDaiyas : ${pager.list}" role="row" class="odd">
                                <td th:text="${dailyBusDaiyas.dailyBusDaiyaId}"></td>
                                <td th:text="${dailyBusDaiyas.rosenName}"></td>
                                <td th:text="${dailyBusDaiyas.lineDetailServiceDivision == 1 ? '往路' : (dailyBusDaiyas.lineDetailServiceDivision == 0 ? '復路' : '')}"></td>
                                <td th:text="${dailyBusDaiyas.lineRouteName}"></td>
                                <td th:text="${dailyBusDaiyas != null && dailyBusDaiyas.serviceDate != null? #strings.replace(#strings.substring(dailyBusDaiyas.serviceDate, 0, 10), '-', '/')  : ''}"></td>

                                <td>
                                    <form method="post" th:action="@{/planDaiya/dailyBusDaiyas/detail/}">
                                        <input type="hidden" name="dailyBusDaiyaId" th:value="${dailyBusDaiyas.dailyBusDaiyaId}" />
                                        <input type="hidden" name="lineDetailServiceDivision" th:value="${dailyBusDaiyas.lineDetailServiceDivision}" />
                                        <input type="hidden" name="page" th:value="${dailyBusDaiyasSearchForm.page}" />
                                        <button th:if="${writeFlag}" type="submit" class="btn btn-info btn-sm double-click" th:formaction="@{/planDaiya/dailyBusDaiyas/detail/}">変更</button>
                                        <button th:if="!${writeFlag}" type="submit" class="btn btn-info btn-sm double-click" th:formaction="@{/planDaiya/dailyBusDaiyas/detail/content/}">確認</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <div th:replace="~{common/paginate :: pagination('/planDaiya/dailyBusDaiyas/',${pager})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:insert="~{common/modal :: customDialog}"></div>
    <th:block th:insert="~{common/script :: common_script}"></th:block>
    <script th:src="@{/js/planDaiya/dailyBusDaiyas/index.js}"></script>

</div>
<!-- END PAGE CONTENT WRAPPER -->
</body>

</html>
