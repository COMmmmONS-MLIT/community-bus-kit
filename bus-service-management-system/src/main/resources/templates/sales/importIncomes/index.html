<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{common/layout}"
      th:with="title='収入情報インポート管理'">
<body>
    <!-- start: contents -->
    <div layout:fragment="main_contents" th:object="${importIncomesSearchForm}">
        <!-- PAGE CONTENT WRAPPER -->
        <div class="page-content-wrap">
            <div class="row">
                <div class="col-md-12">
                    <div class="panel panel-default">
                        <form method="post" th:action="@{#}" class="form-horizontal" onkeydown="return event.key !== 'Enter';">
                            <div class="panel-heading">
                                <h3 class="panel-title">
                                    <strong>収入情報インポート</strong>
                                </h3>
                            </div>
                            <!-- START メッセージ表示部 -->
                            <div th:replace="~{common/message :: common_message_box('success',${successMessages})}"></div>
                            <div th:replace="~{common/message :: common_message_box('danger',${errorMessages})}"></div>
                            <div th:replace="~{common/message :: common_message_box('warning',${warningMessages})}"></div>
                            <!-- END メッセージ表示部 -->
                            <div class="panel-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label class="col-md-1 control-label"><span class="badge badge-danger">必須</span> <span class="form-item-name">路線名</span></label>
                                            <div class="col-md-9">
                                                <div class="input-group col-md-12 div-flex" style="width: 300px;">
                                                    <select id="rosenSelect" class="form-control select2" th:field="*{rosenId}" th:classappend="${#fields.hasErrors('rosenId')} ? 'error' : ''">
                                                        <option value="">------------</option>
                                                        <option th:each="line : ${lineList}" th:value="${line.rosenId}" th:text="${line.rosenName}"></option>
                                                    </select>
                                                </div>
                                                <span th:if="${#fields.hasErrors('rosenId')}" th:errors="*{rosenId}" class="text-danger" ></span>
                                            </div>
                                        </div>
                                        <div class="form-group">
                                            <label class="col-md-1 control-label"><span class="badge badge-danger">必須</span> <span class="form-item-name">　便名</span></label>
                                            <div class="col-md-9">
                                                <div class="input-group col-md-12 div-flex" style="width: 300px;">
                                                    <select id="busServiceSelect" class="form-control select2" th:field="*{busServiceId}" th:attr="data-initial-bus=*{busServiceId}"
                                                            th:classappend="${#fields.hasErrors('busServiceId')} ? 'error' : ''">
                                                        <option value="">------------</option>
                                                    </select>
                                                </div>
                                                <span th:if="${#fields.hasErrors('busServiceId')}" th:errors="*{busServiceId}" class="text-danger" ></span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-group">
                                            <label class="col-md-1 control-label"><span class="badge badge-danger">必須</span> <span class="form-item-name">運行日</span></label>
                                            <div class="col-md-9">
                                                <div class="d-flex align-items-center">
                                                    <input id="serviceDateInput" class="form-control w-auto" type="date" th:field="*{serviceDate}" max="9999-12-31"
                                                           th:classappend="${#fields.hasErrors('serviceDate')} ? 'error' : ''" />
                                                </div>
                                                <span th:if="${#fields.hasErrors('serviceDate')}" th:errors="*{serviceDate}" class="text-danger" ></span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="panel-footer">
                                <div style="display: flex;" class="pull-right">                                    
                                    <button type="submit" style="margin-left: 10px;" class="btn btn-primary btn-submit" th:formaction="@{/sales/importIncomes/}">
                                        <i class="fa fa-search" aria-hidden="true"></i>検索
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div th:if="*{dailyBusDaiyaId} neq null" class="panel panel-default">
                        <form method="post" th:action="@{/sales/importIncomes/register/}">
                        <div class="panel-body">
                            <label style="display:inline-block; font-weight:700; font-size:12px; line-height:1.2; margin:8px 0;">
                                収入情報
                            </label>
                            <table class="table table-striped table-bordered">
                                <thead>
                                    <tr role="row">
                                        <th>乗車人数</th>
                                        <th>現金</th>
                                        <th>ICカード類</th>
                                        <th>回数券</th>
                                        <th th:if="${writeFlag}" style="width: 80px;">操作</th>
                                    </tr>
                                </thead>
                                <tbody style="word-break: break-all;">
                                    <tr role="row" class="odd">
                                        <td>
                                            <input type="text" name="passengersCount" maxlength="10" th:value="*{passengersCount}" class="form-control"
                                                   th:classappend="${#fields.hasErrors('passengersCount')} ? 'error' : ''" th:disabled="${!writeFlag}"/>
                                            <div th:if="${#fields.hasErrors('passengersCount')}" th:errors="*{passengersCount}" class="text-danger"></div>
                                        </td>
                                        <td>
                                            <input type="text" name="cashIncome" maxlength="10" th:value="*{cashIncome}" class="form-control"
                                                   th:classappend="${#fields.hasErrors('cashIncome')} ? 'error' : ''" th:disabled="${!writeFlag}"/>
                                            <div th:if="${#fields.hasErrors('cashIncome')}" th:errors="*{cashIncome}" class="text-danger" ></div>
                                        </td>
                                        <td>
                                            <input type="text" name="icAmount" maxlength="10" th:value="*{icAmount}" class="form-control"
                                                   th:classappend="${#fields.hasErrors('icAmount')} ? 'error' : ''" th:disabled="${!writeFlag}"/>
                                            <div th:if="${#fields.hasErrors('icAmount')}" th:errors="*{icAmount}" class="text-danger" ></div>
                                        </td>
                                        <td>
                                            <input type="text" name="couponTicket" maxlength="10" th:value="*{couponTicket}" class="form-control"
                                                   th:classappend="${#fields.hasErrors('couponTicket')} ? 'error' : ''" th:disabled="${!writeFlag}"/>
                                            <div th:if="${#fields.hasErrors('couponTicket')}" th:errors="*{couponTicket}" class="text-danger" ></div>
                                        </td>
                                        <td th:if="${writeFlag}">
                                                <input type="hidden" name="dailyBusDaiyaId" th:value="*{dailyBusDaiyaId}" />
                                                <input type="hidden" name="incomeInfoId" th:value="*{incomeInfoId}" />
                                                <button type="button" class="btn btn-info btn-sm double-click"
                                                        th:text="*{incomeInfoId} == null ? '登録' : '変更'">登録</button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <th:block th:insert="~{common/script :: common_script}"></th:block>
        <script th:src="@{/js/sales/importIncomes/index.js}"></script>
    </div>
    <!-- END PAGE CONTENT WRAPPER -->
</body>
</html>
