<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{common/layout}"
      th:with="title='キロ程表出力'">
<body>
<!-- start: contents -->
<div layout:fragment="main_contents" th:object="${distanceReportForm}">
    <!-- PAGE CONTENT WRAPPER -->
    <div class="page-content-wrap">
        <div class="row">
            <div class="col-md-12">
                <div class="panel panel-default">
                    <form method="post" th:action="@{#}" class="form-horizontal" onkeydown="return event.key !== 'Enter';">
                        <div class="panel-heading">
                            <h3 class="panel-title">
                                <strong>キロ程表出力</strong>
                            </h3>
                        </div>
                        <!-- START メッセージ表示部 -->
                        <div th:replace="~{common/message :: common_message_box('success',${successMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('danger',${errorMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('warning',${warningMessages})}"></div>
                        <!-- END メッセージ表示部 -->
                        <div class="panel-body">
                            <div class="row">
                                <div class="col-md-9">
                                    <div class="form-group">
                                        <label style="width: 150px" class="col-md-1 control-label ichiran-label"> <span class="badge badge-danger require-txt">必須</span>
                                            <span class="form-item-name">路線名</span>
                                        </label>
                                        <div class="col-md-9">
                                            <select class="form-control select2" id="rosenId" th:field="*{rosenId}" th:classappend="${#fields.hasErrors('rosenId')} ? 'error' : ''">
                                                <option value="">------------</option>
                                                <option th:each="item : ${linesList}" th:value="${item.rosenId}"
                                                        th:text="${item.rosenName}">
                                                </option>
                                            </select>
                                            <p th:if="${#fields.hasErrors('rosenId')}" th:errors="*{rosenId}"  id="rosenIdError" class="text-danger" />
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-md-1 control-label ichiran-label" style="width: 150px;"><span
                                                class="badge badge-danger require-txt">必須</span> <span class="form-item-name">処理対象日</span></label>
                                        <div class="col-md-9">
                                            <div class="input-group col-md-10 div-flex">
                                                <input type="date" max="9999-12" th:field="*{serviceDate}" id="serviceDate"
                                                       class="form-control" style="width: 120px;"
                                                       th:classappend="${#fields.hasErrors('serviceDate')} ? 'error' : ''"/>
                                            </div>
                                            <p th:if="${#fields.hasErrors('serviceDate')}" th:errors="*{serviceDate}"
                                               class="text-danger" id="serviceDateError" style="color:red !important;" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="panel-footer">
                            <div style="display: flex;" class="pull-right">
                                <button th:if="${downloadFlag}" type="submit" style="margin-left: 10px;" class="btn btn-primary btn-submit"
                                        th:formaction="@{/document/distanceReport/downloadExcel}" onclick="errorObjClear()" >
                                    抽出する
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <th:block th:insert="~{common/script :: common_script}"></th:block>
    <script th:src="@{/js/document/distanceReport/index.js}"></script>
</div>
<!-- END PAGE CONTENT WRAPPER -->
</body>
</html>
