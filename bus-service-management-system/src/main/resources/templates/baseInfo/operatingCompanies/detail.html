<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{common/layout}" th:with="title='運行会社登録'">

<body>
<!-- start: contents -->
<div layout:fragment="main_contents" th:object="${displayForm}">
    <!-- PAGE CONTENT WRAPPER -->
    <div class="page-content-wrap">
        <div class="row">
            <div class="col-md-12">
                <form method="post" class="form-horizontal" id="confirmForm" th:action="@{/baseInfo/operatingCompanies/detail/confirm/}">
                    <input type="hidden" name="originSessionKey" th:value="*{sessionKey}">
                    <input type="hidden" th:field="*{page}">
                    <input type="hidden" th:field="*{operatingCompanyId}">
                    <input type="hidden" th:field="*{dispMode}">
                    <div class="panel panel-default">
                        <div class="panel-heading">
                            <h3 class="panel-title">
                                <strong th:text="運行会社__*{dispMode.text}__">運行会社</strong>
                            </h3>
                        </div>
                        <!-- START メッセージ表示部 -->
                        <div th:replace="~{common/message :: common_message_box('success',${successMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('danger',${errorMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('warning',${warningMessages})}"></div>
                        <!-- END メッセージ表示部 -->
                        <div class="panel-body">
                            <div class="form-group">
                                <label class="col-md-1 control-label">
                                    <span class="form-item-name">事業者名</span>
                                </label>
                                <div class="col-md-10">
                                    <div class="input-group col-md-11 div-flex">
                                        <input type="text" name="businessCorpName" th:value="*{businessCorpName}"
                                               class="form-control" style="width: 300px;" th:classappend="${#fields.hasErrors('businessCorpName')} ? 'error' : ''" disabled/>
                                        <input th:if="*{dispMode.value} neq '3'" type="hidden" name="businessCorpName" th:value="*{businessCorpName}">
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-1 control-label">
                                    <span class="badge badge-danger require-txt">必須</span>
                                    <span class="form-item-name">運行会社名</span>
                                </label>
                                <div class="col-md-10">
                                    <div class="input-group col-md-11 div-flex">
                                        <input type="text" name="operatingName" maxlength="400" th:value="*{operatingName}" class="form-control" style="width: 300px;" th:classappend="${#fields.hasErrors('operatingName')} ? 'error' : ''"/>
                                    </div>
                                    <span th:if="*{#fields.hasErrors('operatingName')}" th:errors="*{operatingName}" class="text-danger">
                                    </span>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-md-1" ><span
                                        class="form-item-name">電話番号</span></label>
                                <div class="col-md-10">
                                    <div class="input-group col-md-11 div-flex">
                                        <input type="text" th:field="*{phoneNumber}" maxlength="15" class="form-control" style="width: 300px;" th:classappend="${#fields.hasErrors('phoneNumber')} ? 'error' : ''" />
                                    </div>
                                    <p th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}" style="color:red" ></p>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-md-1" ><span
                                        class="form-item-name">連絡先メール</span></label>
                                <div class="col-md-10">
                                    <div class="input-group col-md-11 div-flex">
                                        <input type="text" th:field="*{mailAddress}" maxlength="256" class="form-control" style="width: 300px;" th:classappend="${#fields.hasErrors('mailAddress')} ? 'error' : ''" />
                                    </div>
                                    <p th:if="${#fields.hasErrors('mailAddress')}" th:errors="*{mailAddress}" style="color:red" ></p>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="control-label col-md-1" ><span
                                        class="form-item-name">URL</span></label>
                                <div class="col-md-10">
                                    <div class="input-group col-md-11 div-flex">
                                        <input type="text" th:field="*{url}" maxlength="256" class="form-control" style="width: 300px;" th:classappend="${#fields.hasErrors('url')} ? 'error' : ''" />
                                    </div>
                                    <p th:if="${#fields.hasErrors('url')}" th:errors="*{url}" style="color:red" ></p>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-1 control-label" style="white-space:nowrap;">
                                    <span class="badge badge-danger require-txt">必須</span>
                                    <span class="form-item-name">利用区分</span>
                                </label>
                                <div class="col-md-10">
                                    <div class="col-md-12 radio">
                                        <th:block th:each="flg : ${T(maint.enums.UsageDivision).values()}">
                                            <input type="radio" name="availableFlag" th:id="avFlg__${flg.value}__" th:value="${flg.value}"
                                                   th:checked="${flg.value} == (*{availableFlag} != null ? *{availableFlag} : '1')" th:classappend="${#fields.hasErrors('availableFlag')} ? 'error' : ''"/>
                                            <label class="inner-title" th:for="avFlg__${flg.value}__" th:text="${flg.text}"></label>
                                        </th:block>
                                        <p th:if="${#fields.hasErrors('availableFlag')}" th:errors="*{availableFlag}" class="text-danger"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="panel-footer" style="text-align: right;">
                            <a th:href="'/baseInfo/operatingCompanies/' + *{page} + '/'" class=" btn btn-default">戻る</a>
                            <button type="button" id="confirm" class="btn btn-primary pull-right double-click" style="margin-left: 5px">確認</button>
                        </div>
                    </div>
                    <div th:insert="~{common/modal :: passReissueDialog}" th:remove="tag"></div>
                </form>
            </div>
        </div>
        <th:block th:insert="~{common/script :: common_script}"></th:block>
    </div>
    <!-- END PAGE CONTENT WRAPPER -->
</div>
<!-- end: contents -->
</body>
</html>
