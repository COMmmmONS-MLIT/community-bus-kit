<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{common/layout}"
      th:with="title='停留所・標柱管理'">
<body>
<!-- start: contents -->
<div layout:fragment="main_contents" th:object="${busStopsSearchForm}">
    <!-- PAGE CONTENT WRAPPER -->
    <div class="page-content-wrap">
        <div class="row">
            <div class="col-md-12">
                <div class="panel panel-default">
                    <form method="post" th:action="@{#}" class="form-horizontal">
                        <div class="panel-heading">
                            <h3 class="panel-title">
                                <strong>停留所一覧</strong>
                            </h3>
                        </div>
                        <!-- START メッセージ表示部 -->
                        <div th:replace="~{common/message :: common_message_box('success',${successMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('danger',${errorMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('warning',${warningMessages})}"></div>
                        <!-- END メッセージ表示部 -->
                        <div class="panel-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="col-md-1 control-label"><span class="badge badge-danger"></span> <span class="form-item-name">停留所名</span></label>
                                        <div class="col-md-9">
                                            <div class="input-group col-md-12 div-flex">
                                                <input type="text" th:field="*{busStopName}" class="form-control" maxlength="100" style="width: 300px;"
                                                       th:classappend="${#fields.hasErrors('busStopName')} ? 'error' : ''" />
                                                <div><span class="help-block text-danger" style="width: 100px;">※部分一致</span></div>
                                            </div>
                                            <span th:if="${#fields.hasErrors('busStopName')}" th:errors="*{busStopName}" class="text-danger" ></span>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-md-1 control-label"><span class="badge badge-danger"></span> <span class="form-item-name">停留所コード</span></label>
                                        <div class="col-md-9">
                                            <div class="input-group col-md-12 div-flex">
                                                <input type="text" th:field="*{busStopCode}" class="form-control" maxlength="10" style="width: 300px;"
                                                       th:classappend="${#fields.hasErrors('busStopCode')} ? 'error' : ''" />
                                            </div>
                                            <span th:if="${#fields.hasErrors('busStopCode')}" th:errors="*{busStopCode}" class="text-danger" ></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="col-md-1 control-label"><span class="badge badge-danger"></span> <span class="form-item-name">利用期間</span></label>
                                        <div class="col-md-9">
                                            <div class="d-flex align-items-center">
                                                <input class="form-control w-auto" type="date" th:field="*{serviceStartDate}" max="9999-12-31"
                                                       th:classappend="${#fields.hasErrors('serviceStartDate')} ? 'error' : ''" />
                                                <span class="mx-2"> ～ </span>
                                                <input class="form-control w-auto" type="date" th:field="*{serviceEndDate}" max="9999-12-31"
                                                       th:classappend="${#fields.hasErrors('serviceEndDate')} ? 'error' : ''" />
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-md-1 control-label"><span class="badge badge-danger"></span> <span class="form-item-name">利用可否</span></label>
                                        <div class="col-md-9">
                                            <div class="radio col-md-12">
                                                <input type="radio" name="searchUsageDivision" th:id="searchUsageDivision__0__" th:value="1" th:checked="*{searchUsageDivision eq 1}"/>
                                                <label class="inner-title" th:for="searchUsageDivision__0__" th:text="利用中"></label>
                                                <input type="radio" name="searchUsageDivision" th:id="searchUsageDivision__1__" th:value="0" th:checked="*{searchUsageDivision eq 0}"/>
                                                <label class="inner-title" th:for="searchUsageDivision__1__" th:text="利用不可"></label>
                                            </div>
                                            <span th:if="${#fields.hasErrors('searchUsageDivision')}" th:errors="*{searchUsageDivision}" class="text-danger" ></span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="panel-footer">
                            <button th:if="${writeFlag}" type="button" class="btn btn-success btn-default btn-submit" onclick="location.href='/baseInfo/busStopSignposts/detail/'">
                                <i class="fa fa-pencil-square-o" aria-hidden="true"></i>新規登録
                            </button>
                            <div style="display: flex;" class="pull-right">
                                <button type="submit" style="margin-left: 10px;" class="btn btn-primary btn-submit" th:formaction="@{/baseInfo/busStopSignposts/}">
                                    <i class="fa fa-search" aria-hidden="true"></i>検索
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="panel panel-default">
                    <div class="panel-body">
                        <table class="table table-striped table-bordered">
                            <thead>
                            <tr role="row">
                                <th style="width: 60px;">ID</th>
                                <th>停留所コード</th>
                                <th>事業者名</th>
                                <th>停留所名称</th>
                                <th>利用期間</th>
                                <th>利用可否</th>
                                <th style="width: 80px;">操作</th>
                            </tr>
                            </thead>
                            <tbody th:if="${pager} neq null" style="word-break: break-all;">
                            <tr role="row" class="odd" th:each="busStop : ${pager.list}">
                                <td th:text="${busStop.busStopId}">1</td>
                                <td th:text="${busStop.busStopCode}">CODE0000</td>
                                <td th:text="${busStop.businessCorpName}">事業者名</td>
                                <td th:text="${busStop.busStopName}">停留所名称</td>
                                <td th:text="${busStop.serviceStartDate + ' ～ ' + busStop.serviceEndDate}">2025/08/08 ~ 9999/12/31</td>
                                <td th:text="${busStop.availableFlag}? '利用中':'利用不可'">利用中</td>
                                <td>
                                    <form th:if="${writeFlag}" method="post" th:action="@{/baseInfo/busStopSignposts/detail/}">
                                        <input type="hidden" name="busStopId" th:value="${busStop.busStopId}" />
                                        <input type="hidden" name="page" th:value="*{page}" />
                                        <button type="submit" class="btn btn-info btn-sm double-click">変更</button>
                                    </form>
                                    <form th:if="${!writeFlag}" method="post" th:action="@{/baseInfo/busStopSignposts/detail/content/}">
                                        <input type="hidden" name="busStopId" th:value="${busStop.busStopId}" />
                                        <input type="hidden" name="page" th:value="*{page}" />
                                        <button type="submit" class="btn btn-info btn-sm double-click">確認</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <div th:replace="~{common/paginate :: pagination('/baseInfo/busStopSignposts/',${pager})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block th:insert="~{common/script :: common_script}"></th:block>
</div>
<!-- END PAGE CONTENT WRAPPER -->
</body>
</html>
