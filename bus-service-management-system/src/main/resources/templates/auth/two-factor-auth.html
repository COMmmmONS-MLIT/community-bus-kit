<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity4" class="body-full-height">

<head>
  <title>２要素認証</title>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="robots" content="noindex,nofollow,noodp" />
  <link rel="icon" href="/img/favicon.ico" type="image/x-icon" />
  <!-- CSS INCLUDE -->
  <link rel="stylesheet" type="text/css" id="theme" th:href="@{/css/default.css}" />
  <!-- EOF CSS INCLUDE -->
</head>

<body>

<div class="login-container">
  <div class="login-box animated fadeInDown">
    <div>
      <span class="login-title">COMMUNITY BUS</span>
    </div>
    <div class="login-body">
      <div th:replace="~{common/message :: common_message_box('danger',${errorMessages})}" th:remove="tag"></div>
      <form id="twoFactorForm" method="post" th:object="${twoFactorForm}" th:action="@{#}">
        <div class="form-group">
          <div class="col-md-12" style="padding-top:10px;">
            <label style="color: white; font-size: 15px">認証コード</label>
            <input type="text" class="form-control" th:field="*{authCode}" style="width: 100%;" maxlength="6" />
            <p th:if="${#fields.hasErrors('authCode')}" th:errors="*{authCode}" class="text-danger" style="margin-top: 5px;" />
          </div>
        </div>
        <div class="form-group">
          <div class="col-md-12" style="padding-top:10px;">
            <div style="display: flex; justify-content: space-between;">
              <input type="submit" id="resend-auth-Btn" class="btn btn-info" value="再送信" th:formaction="@{/auth/login/resend-auth-code}" />
              <input type="submit" class="btn btn-info" value="LOGIN" th:formaction="@{/auth/login/check-auth-code}" />
            </div>
          </div>
        </div>
      </form>
    </div>
    <div class="login-footer">
      <div class="pull-left">
        Copyright &copy; Will Smart co.,Ltd. All Rights Reserved.
      </div>
    </div>
  </div>
</div>
</body>
