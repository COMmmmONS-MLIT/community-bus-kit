<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{common/layout}"
      th:with="title='運行カレンダー管理'">
<body class="body-calendar-detail">
    <!-- start: contents -->
    <div layout:fragment="main_contents" th:object="${calendarsDetailForm}">
        <!-- PAGE CONTENT WRAPPER -->
        <div class="page-content-wrap">
            <div class="row">
                <div class="col-md-12">
                    <form method="post" class="form-horizontal" id="confirmForm" th:action="@{/operation/calendars/detail/confirm/}">
                        <input type="hidden" name="originSessionKey" th:value="*{sessionKey}">
                        <input type="hidden" th:field="*{page}">
                        <input type="hidden" th:field="*{calendarId}">
                        <input type="hidden" th:field="*{dispMode}">
                        <div class="panel panel-default">
                            <div class="panel-heading">
                                <h3 class="panel-title">
                                    <strong th:text="運行カレンダー__*{dispMode.text}__">運行カレンダー登録</strong>
                                </h3>
                            </div>
                            <!-- START メッセージ表示部 -->
                            <div th:replace="~{common/message :: common_message_box('success',${successMessages})}"></div>
                            <div th:replace="~{common/message :: common_message_box('danger',${errorMessages})}"></div>
                            <div th:replace="~{common/message :: common_message_box('warning',${warningMessages})}"></div>
                            <!-- END メッセージ表示部 -->
                            <div class="panel-body">
                                <div class="form-group">
                                    <label class="col-md-1 control-label" style="width: 200px;"><span class="badge badge-danger require-txt">必須</span> <span class="form-item-name">運行カレンダー区分</span></label>
                                    <div class="col-md-10">
                                        <div class="input-group col-md-11 div-flex">
                                            <input type="text" name="calendarType" maxlength="60" th:value="*{calendarType}" class="form-control"
                                                style="width: 300px;" th:classappend="${#fields.hasErrors('calendarType')} ? 'error' : ''" />
                                            <button type="button" class="btn btn-default btn-xs help-toggle" onclick="toggleHelp('calendarType-help', this)">「平日」「土日祝」「... ＞ </button>
                                        </div>
                                        <p th:if="${#fields.hasErrors('calendarType')}" th:errors="*{calendarType}" class="text-danger" />
                                        <div class="form-group">
                                            <div class="alert alert-info" id="calendarType-help"
                                                 style="display:none; margin:10px 0 0 15px; max-width:600px;">
                                                「平日」「土日祝」「夏ダイヤ」「登校日ダイヤ」などの運行日を示す名称を入力。
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-md-1 control-label" style="width: 200px;"><span class="badge badge-danger require-txt">必須</span> <span class="form-item-name">曜日指定可否区分</span></label>
                                    <div class="col-md-9">
                                        <div class="radio col-md-12">
                                            <th:block th:each="weekDesignatableFlag : ${T(maint.enums.WeekDesignatableFlag).values()}">
                                                <input type="radio" name="weekDesignatableFlag" th:id="weekDesignatableFlag__${weekDesignatableFlag.value}__" th:value="${weekDesignatableFlag.value}"
                                                       th:checked="${weekDesignatableFlag.value} eq *{weekDesignatableFlag}" />
                                                <label class="inner-title" th:for="weekDesignatableFlag__${weekDesignatableFlag.value}__" th:text="${weekDesignatableFlag.text}"></label>
                                            </th:block>
                                            <button type="button" class="btn btn-default btn-xs help-toggle" onclick="toggleHelp('weekDesignatableFlag-help', this)" style="margin-left: 6px;">通常は「指定可」を選... ＞ </button>
                                        </div>
                                        <span th:if="${#fields.hasErrors('weekDesignatableFlag')}" th:errors="*{weekDesignatableFlag}" class="text-danger" ></span>
                                        <div class="form-group">
                                            <div class="alert alert-info" id="weekDesignatableFlag-help"
                                                 style="display:none; margin:10px 0 0 15px; max-width:600px;">
                                                通常は「指定可」を選択<br/>
                                                曜日で定義するのではなく、日付で運行日を定義する場合は「指定不可」を選択
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group" id="section-weekDesignationType">
                                    <label class="col-md-1 control-label" style="width: 200px;"><span class="badge badge-danger require-txt">必須</span> <span class="form-item-name">曜日祝日指定区分</span></label>
                                    <div class="col-md-9">
                                        <div class="radio col-md-12">
                                            <th:block th:each="weekDesignationType : ${T(maint.enums.WeekDesignationType).values()}">
                                                <input type="radio" name="weekDesignationType" th:id="weekDesignationType__${weekDesignationType.value}__" th:value="${weekDesignationType.value}"
                                                       th:checked="${weekDesignationType.value} eq *{weekDesignationType}" />
                                                <label class="inner-title" th:for="weekDesignationType__${weekDesignationType.value}__" th:text="${weekDesignationType.text}"></label>
                                            </th:block>
                                        </div>
                                        <span th:if="${#fields.hasErrors('weekDesignationType')}" th:errors="*{weekDesignationType}" class="text-danger" ></span>
                                    </div>
                                </div>
                                <div class="form-group" id="section-weekday">
                                    <label class="col-md-1 control-label" style="width: 200px;"><span class="badge badge-danger require-txt">必須</span><span class="form-item-name">曜日区分</span></label>
                                    <div class="col-md-9">
                                        <div class="weekday-row col-md-12"
                                             style="display:flex; flex-wrap:wrap; gap:14px; align-items:center; line-height:1;">
                                           <span style="display:inline-flex; align-items:center; gap:6px; height:28px;">
                                             <input type="checkbox" id="sunday" th:field="*{sunday}" style="margin:0; vertical-align:middle;"/>
                                             <label for="sunday" style="margin:0; line-height:1.2; font-weight:400; vertical-align:middle;">日曜</label>
                                           </span>
                                           <span style="display:inline-flex; align-items:center; gap:6px; height:28px;">
                                             <input type="checkbox" id="monday" th:field="*{monday}" style="margin:0; vertical-align:middle;"/>
                                             <label for="monday" style="margin:0; line-height:1.2; font-weight:400; vertical-align:middle;">月曜</label>
                                           </span>
                                           <span style="display:inline-flex; align-items:center; gap:6px; height:28px;">
                                             <input type="checkbox" id="tuesday" th:field="*{tuesday}" style="margin:0; vertical-align:middle;"/>
                                             <label for="tuesday" style="margin:0; line-height:1.2; font-weight:400; vertical-align:middle;">火曜</label>
                                           </span>
                                           <span style="display:inline-flex; align-items:center; gap:6px; height:28px;">
                                             <input type="checkbox" id="wednesday" th:field="*{wednesday}" style="margin:0; vertical-align:middle;"/>
                                             <label for="wednesday" style="margin:0; line-height:1.2; font-weight:400; vertical-align:middle;">水曜</label>
                                           </span>
                                           <span style="display:inline-flex; align-items:center; gap:6px; height:28px;">
                                             <input type="checkbox" id="thursday" th:field="*{thursday}" style="margin:0; vertical-align:middle;"/>
                                             <label for="thursday" style="margin:0; line-height:1.2; font-weight:400; vertical-align:middle;">木曜</label>
                                           </span>
                                           <span>
                                             <input type="checkbox" id="friday" th:field="*{friday}" />
                                             <label for="friday" style="font-weight: 400">金曜</label>
                                           </span>
                                           <span style="display:inline-flex; align-items:center; gap:6px; height:28px;">
                                             <input type="checkbox" id="saturday" th:field="*{saturday}" style="margin:0; vertical-align:middle;"/>
                                             <label for="saturday" style="margin:0; line-height:1.2; font-weight:400; vertical-align:middle;">土曜</label>
                                           </span>
                                           <span style="display:inline-flex; align-items:center; gap:6px; height:28px;">
                                             <input type="checkbox" id="holiday" th:field="*{holiday}" style="margin:0; vertical-align:middle;"/>
                                             <label for="holiday" style="margin:0; line-height:1.2; font-weight:400; vertical-align:middle;">祝日</label>
                                           </span>
                                        </div>
                                      <span th:if="${#fields.hasErrors('sunday')}" th:errors="*{sunday}" class="text-danger" ></span>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label class="col-md-1 control-label" style="width: 200px;"><span class="badge badge-danger require-txt">必須</span> <span class="form-item-name">利用区分</span></label>
                                    <div class="col-md-9">
                                        <div class="radio col-md-12">
                                            <th:block th:each="availableFlag : ${T(maint.enums.UsageDivision).values()}">
                                                <input type="radio" name="availableFlag" th:id="availableFlag__${availableFlag.value}__" th:value="${availableFlag.value}"
                                                       th:checked="${availableFlag.value} eq *{availableFlag}" />
                                                <label class="inner-title" th:for="availableFlag__${availableFlag.value}__" th:text="${availableFlag.text}"></label>
                                            </th:block>
                                            <button type="button" class="btn btn-default btn-xs help-toggle" onclick="toggleHelp('availableFlag-help', this)" >このカレンダー区分を... ＞ </button>
                                        </div>
                                        <span th:if="${#fields.hasErrors('availableFlag')}" th:errors="*{availableFlag}" class="text-danger" ></span>
                                        <div class="form-group">
                                            <div class="alert alert-info" id="availableFlag-help"
                                                 style="display:none; margin:10px 0 0 15px; max-width:600px;">
                                                このカレンダー区分を利用できるかどうかの区分・・・使用しなくなった場合は「利用不可」を選択。
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="calendar-scroll-wrapper">
                                      <label style="display:inline-block; font-weight:700; font-size:12px; line-height:1.2; margin:8px 0;">
                                        運行除外日設定
                                      </label>
                                      <table class="table table-striped table-bordered table-exclusions">
                                          <thead>
                                              <tr role="row">
                                                  <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行除外日</th><th style="width: 80px;">削除</th>
                                                  <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行除外日</th><th style="width: 80px;">削除</th>
                                                  <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行除外日</th><th style="width: 80px;">削除</th>
                                                  <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行除外日</th><th style="width: 80px;">削除</th>
                                                  <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行除外日</th><th style="width: 80px;">削除</th>
                                                  <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行除外日</th><th style="width: 80px;">削除</th>
                                                  <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行除外日</th><th style="width: 80px;">削除</th>
                                                  <th style="min-width: 60px;">操作</th>
                                              </tr>
                                          </thead>
                                          <tbody id="cancelDateTbody" style="word-break: break-all;"
                                                 th:with="size=${#lists.size(calendarsDetailForm.calendarCancelDateList)}">
                                            <tr th:if="${size == 0}" role="row" class="odd">
                                                <th:block th:each="c : ${#numbers.sequence(0,6)}">
                                                    <td>
                                                        <input type="hidden" th:name="${'calendarCancelDateList['+c+'].calendarCancelDateId'}" value="">
                                                        <input type="hidden" th:name="${'calendarCancelDateList['+c+'].keep'}" value="1"/>
                                                    </td>
                                                    <td>
                                                        <input type="text" th:name="${'calendarCancelDateList['+c+'].operationCancelDate'}"
                                                               maxlength="6" placeholder="yymmdd" style="width: 80px;" />
                                                        <div class="text-danger" th:if="${#fields.hasErrors('calendarCancelDateList[' + c + '].operationCancelDate')}"
                                                              th:errors="*{calendarCancelDateList[__${c}__].operationCancelDate}"></div>
                                                    </td>
                                                    <td>
                                                        <input type="checkbox" th:name="${'calendarCancelDateList['+c+'].delete'}" />
                                                    </td>
                                                </th:block>
                                                <td style="white-space:nowrap;">
                                                    <button type="button" class="btn btn-danger btn-sm" style="display:inline-block;"
                                                            th:if="*{dispMode.value} neq '1'" onclick="deleteExclusionRow(this)">削除</button>
                                                    <button type="button" class="btn btn-success btn-sm"
                                                            style="display:inline-block; margin-left:8px;" onclick="addExclusionRow(this)">追加</button>
                                                </td>
                                            </tr>
                                            <th:block th:if="${size > 0}" th:with="last=${size - 1}">
                                                <th:block th:each="start : ${#numbers.sequence(0, last)}">
                                                    <tr th:if="${start % 7 == 0}" role="row" class="odd"
                                                        th:with="rowHasExisting=${
                                                              (start     < size and calendarsDetailForm.calendarCancelDateList[start    ]?.calendarCancelDateId != null) or
                                                              (start + 1 < size and calendarsDetailForm.calendarCancelDateList[start + 1]?.calendarCancelDateId != null) or
                                                              (start + 2 < size and calendarsDetailForm.calendarCancelDateList[start + 2]?.calendarCancelDateId != null) or
                                                              (start + 3 < size and calendarsDetailForm.calendarCancelDateList[start + 3]?.calendarCancelDateId != null) or
                                                              (start + 4 < size and calendarsDetailForm.calendarCancelDateList[start + 4]?.calendarCancelDateId != null) or
                                                              (start + 5 < size and calendarsDetailForm.calendarCancelDateList[start + 5]?.calendarCancelDateId != null) or
                                                              (start + 6 < size and calendarsDetailForm.calendarCancelDateList[start + 6]?.calendarCancelDateId != null)}">
                                                        <th:block th:each="c : ${#numbers.sequence(0,6)}" th:with="idx=${start + c}">
                                                            <td th:if="${idx < size}">
                                                                <input type="hidden" th:field="*{calendarCancelDateList[__${idx}__].calendarCancelDateId}">
                                                                <input type="hidden" th:field="*{calendarCancelDateList[__${idx}__].keep}" value="1"/>
                                                                <span th:text="*{calendarCancelDateList[__${idx}__].calendarCancelDateId}"></span>
                                                            </td>
                                                            <td th:if="${idx < size}">
                                                                <input type="text" th:field="*{calendarCancelDateList[__${idx}__].operationCancelDate}"
                                                                       maxlength="6" placeholder="yymmdd" style="width: 80px;"
                                                                       th:disabled="*{calendarCancelDateList[__${idx}__].calendarCancelDateId != null}"
                                                                       th:data-locked="${calendarsDetailForm.calendarCancelDateList[__${idx}__].calendarCancelDateId != null}" />
                                                                <div class="text-danger" th:if="${#fields.hasErrors('calendarCancelDateList[' + idx + '].operationCancelDate')}"
                                                                     th:errors="*{calendarCancelDateList[__${idx}__].operationCancelDate}"></div>
                                                            </td>
                                                            <td th:if="${idx < size}">
                                                                <input type="checkbox" th:field="*{calendarCancelDateList[__${idx}__].delete}" />
                                                            </td>
                                                            <td th:if="${idx >= size}">
                                                                <input type="hidden" th:name="${'calendarCancelDateList['+idx+'].calendarCancelDateId'}" value="">
                                                                <input type="hidden" th:name="${'calendarCancelDateList['+idx+'].keep'}" value="1"/>
                                                            </td>
                                                            <td th:if="${idx >= size}">
                                                                <input type="text" th:name="${'calendarCancelDateList['+idx+'].operationCancelDate'}"
                                                                       maxlength="6" placeholder="yymmdd" style="width: 80px;" />
                                                                <div class="text-danger" th:if="${#fields.hasErrors('calendarCancelDateList[' + idx + '].operationCancelDate')}"
                                                                      th:errors="*{calendarCancelDateList[__${idx}__].operationCancelDate}"></div>
                                                            </td>
                                                            <td th:if="${idx >= size}">
                                                                <input type="checkbox" th:name="${'calendarCancelDateList['+idx+'].delete'}" />
                                                            </td>
                                                        </th:block>
                                                        <td style="white-space:nowrap;">
                                                            <button type="button" class="btn btn-danger btn-sm" style="display:inline-block;"
                                                                th:if="!${rowHasExisting}" onclick="deleteExclusionRow(this)">削除</button>
                                                            <button type="button" class="btn btn-success btn-sm" style="display:inline-block; margin-left:8px;"
                                                                onclick="addExclusionRow(this)">追加</button>
                                                        </td>
                                                    </tr>
                                                </th:block>
                                            </th:block>
                                          </tbody>
                                      </table>
                                      <label style="display:inline-block; font-weight:700; font-size:12px; line-height:1.2; margin:8px 0;">
                                          運行指定日設定
                                      </label>
                                      <table class="table table-striped table-bordered table-exclusions">
                                          <thead>
                                              <tr role="row">
                                                    <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行指定日</th><th style="width: 80px;">削除</th>
                                                    <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行指定日</th><th style="width: 80px;">削除</th>
                                                    <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行指定日</th><th style="width: 80px;">削除</th>
                                                    <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行指定日</th><th style="width: 80px;">削除</th>
                                                    <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行指定日</th><th style="width: 80px;">削除</th>
                                                    <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行指定日</th><th style="width: 80px;">削除</th>
                                                    <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行指定日</th><th style="width: 80px;">削除</th>
                                                    <th style="min-width: 60px;">操作</th>
                                              </tr>
                                          </thead>
                                          <tbody style="word-break: break-all;"
                                                th:with="size=${#lists.size(calendarsDetailForm.calendarDesignatedDateList)}">
                                              <tr th:if="${size == 0}" role="row" class="odd">
                                                    <th:block th:each="c : ${#numbers.sequence(0,6)}">
                                                        <td>
                                                            <input type="hidden" th:name="${'calendarDesignatedDateList['+c+'].calendarDesignatedDateId'}" value="">
                                                            <input type="hidden" th:name="${'calendarDesignatedDateList['+c+'].keep'}" value="1"/>
                                                            <span></span>
                                                        </td>
                                                        <td>
                                                            <input type="text" th:name="${'calendarDesignatedDateList['+c+'].operationDesignatedDate'}"
                                                                   maxlength="6" placeholder="yymmdd" style="width: 80px;" />
                                                            <div class="text-danger" th:if="${#fields.hasErrors('calendarDesignatedDateList[' + c + '].operationDesignatedDate')}"
                                                                 th:errors="*{calendarDesignatedDateList[__${c}__].operationDesignatedDate}"></div>
                                                        </td>
                                                        <td>
                                                            <input type="checkbox" th:name="${'calendarDesignatedDateList['+c+'].delete'}" />
                                                        </td>
                                                    </th:block>
                                                    <td style="white-space:nowrap;">
                                                        <button type="button" class="btn btn-danger btn-sm" style="display:inline-block;"
                                                                th:if="*{dispMode.value} neq '1'" onclick="deleteDesignatedRow(this)">削除</button>
                                                        <button type="button" class="btn btn-success btn-sm"
                                                                style="display:inline-block; margin-left:8px;" onclick="addDesignatedRow(this)">追加</button>
                                                    </td>
                                              </tr>
                                              <th:block th:if="${size > 0}" th:with="last=${size - 1}">
                                                    <th:block th:each="start : ${#numbers.sequence(0, last)}">
                                                        <tr th:if="${start % 7 == 0}" role="row" class="odd"
                                                            th:with="rowHasExisting=${
                                                      (start     < size and calendarsDetailForm.calendarDesignatedDateList[start    ]?.calendarDesignatedDateId != null) or
                                                      (start + 1 < size and calendarsDetailForm.calendarDesignatedDateList[start + 1]?.calendarDesignatedDateId != null) or
                                                      (start + 2 < size and calendarsDetailForm.calendarDesignatedDateList[start + 2]?.calendarDesignatedDateId != null) or
                                                      (start + 3 < size and calendarsDetailForm.calendarDesignatedDateList[start + 3]?.calendarDesignatedDateId != null) or
                                                      (start + 4 < size and calendarsDetailForm.calendarDesignatedDateList[start + 4]?.calendarDesignatedDateId != null) or
                                                      (start + 5 < size and calendarsDetailForm.calendarDesignatedDateList[start + 5]?.calendarDesignatedDateId != null) or
                                                      (start + 6 < size and calendarsDetailForm.calendarDesignatedDateList[start + 6]?.calendarDesignatedDateId != null)}">
                                                            <th:block th:each="c : ${#numbers.sequence(0,6)}" th:with="idx=${start + c}">
                                                                <td th:if="${idx < size}">
                                                                    <input type="hidden" th:field="*{calendarDesignatedDateList[__${idx}__].calendarDesignatedDateId}">
                                                                    <input type="hidden" th:field="*{calendarDesignatedDateList[__${idx}__].keep}" value="1"/>
                                                                    <span th:text="*{calendarDesignatedDateList[__${idx}__].calendarDesignatedDateId}"></span>
                                                                </td>
                                                                <td th:if="${idx < size}">
                                                                    <input type="text" th:field="*{calendarDesignatedDateList[__${idx}__].operationDesignatedDate}"
                                                                           maxlength="6" placeholder="yymmdd" style="width: 80px;" th:disabled="*{calendarDesignatedDateList[__${idx}__].calendarDesignatedDateId != null}"/>
                                                                    <div class="text-danger" th:if="${#fields.hasErrors('calendarDesignatedDateList[' + idx + '].operationDesignatedDate')}"
                                                                         th:errors="*{calendarDesignatedDateList[__${idx}__].operationDesignatedDate}"></div>
                                                                </td>
                                                                <td th:if="${idx < size}">
                                                                    <input type="checkbox" th:field="*{calendarDesignatedDateList[__${idx}__].delete}" />
                                                                </td>

                                                                <td th:if="${idx >= size}">
                                                                    <input type="hidden" th:name="${'calendarDesignatedDateList['+idx+'].calendarDesignatedDateId'}" value="">
                                                                    <input type="hidden" th:name="${'calendarDesignatedDateList['+idx+'].keep'}" value="1"/>
                                                                    <span></span>
                                                                </td>
                                                                <td th:if="${idx >= size}">
                                                                    <input type="text" th:name="${'calendarDesignatedDateList['+idx+'].operationDesignatedDate'}"
                                                                           maxlength="6" placeholder="yymmdd" style="width: 80px;" />
                                                                    <div class="text-danger" th:if="${#fields.hasErrors('calendarDesignatedDateList[' + idx + '].operationDesignatedDate')}"
                                                                         th:errors="*{calendarDesignatedDateList[__${idx}__].operationDesignatedDate}"></div>
                                                                </td>
                                                                <td th:if="${idx >= size}">
                                                                    <input type="checkbox" th:name="${'calendarDesignatedDateList['+idx+'].delete'}" />
                                                                </td>
                                                            </th:block>

                                                            <td style="white-space:nowrap;">
                                                                <button type="button" class="btn btn-danger btn-sm" style="display:inline-block;"
                                                                        th:if="!${rowHasExisting}" onclick="deleteDesignatedRow(this)">削除</button>
                                                                <button type="button" class="btn btn-success btn-sm" style="display:inline-block; margin-left:8px;"
                                                                        onclick="addDesignatedRow(this)">追加</button>
                                                            </td>
                                                        </tr>
                                                    </th:block>
                                              </th:block>
                                          </tbody>
                                      </table>
                                </div>
                            </div>
                            <div class="panel-footer">
                                <div class="pull-right">
                                    <a th:href="'/operation/calendars/' + *{page} + '/'" class=" btn btn-default" style="margin-right: 8px;">戻る</a>
                                    <button type="button" id="confirm" class="btn btn-primary pull-right double-click">確認</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
            <th:block th:insert="~{common/script :: common_script}"></th:block>
            <script th:src="@{/js/operation/calendars/detail.js}"></script>
        </div>
        <!-- END PAGE CONTENT WRAPPER -->
        <style>
            @media (max-width: 991px) {
