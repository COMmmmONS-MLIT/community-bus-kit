<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{common/layout}"
      th:with="title='運行カレンダー管理'">
<body class="body-calendar-detail">
    <!-- start: contents -->
    <div layout:fragment="main_contents" th:object="${calendarsDetailForm}">
        <!-- PAGE CONTENT WRAPPER -->
        <div class="page-content-wrap">
            <div class="row">
                <div class="col-md-12 form-horizontal">
                    <div class="panel panel-default">
                        <div class="panel-heading">
                            <h3 class="panel-title">
                                <strong th:text="運行カレンダー__*{dispMode.text}__確認">運行カレンダー登録確認</strong>
                            </h3>
                        </div>
                        <!-- START メッセージ表示部 -->
                        <div th:insert="~{common/message :: common_message_box('success',${successMessages})}"></div>
                        <div th:insert="~{common/message :: common_message_box('danger',${errorMessages})}"></div>
                        <div th:insert="~{common/message :: common_message_box('warning',${warningMessages})}"></div>
                        <!-- END メッセージ表示部 -->
                        <div class="panel-body">
                            <div class="form-group">
                                <label class="col-md-1 control-label" style="width: 200px;"> <span class="form-item-name">運行カレンダー区分</span></label>
                                <div class="col-md-10">
                                    <div class="input-group col-md-11 div-flex">
                                        <input type="text" name="calendarType" maxlength="60" th:value="*{calendarType}" class="form-control" style="width: 300px;" disabled/>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-1 control-label" style="width: 200px;"> <span class="form-item-name">曜日指定可否区分</span></label>
                                <div class="col-md-9">
                                    <div class="radio col-md-12">
                                        <th:block th:each="weekDesignatableFlag : ${T(maint.enums.WeekDesignatableFlag).values()}">
                                            <input type="radio" name="weekDesignatableFlag" th:id="weekDesignatableFlag__${weekDesignatableFlag.value}__" th:value="${weekDesignatableFlag.value}"
                                                   th:checked="${weekDesignatableFlag.value} eq *{weekDesignatableFlag}" disabled/>
                                            <label class="inner-title" th:for="weekDesignatableFlag__${weekDesignatableFlag.value}__" th:text="${weekDesignatableFlag.text}"></label>
                                        </th:block>
                                    </div>
                                    <span th:if="${#fields.hasErrors('weekDesignatableFlag')}" th:errors="*{weekDesignatableFlag}" class="text-danger" ></span>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-1 control-label" style="width: 200px;"> <span class="form-item-name">曜日祝日指定区分</span></label>
                                <div class="col-md-9">
                                    <div class="radio col-md-12">
                                        <th:block th:each="weekDesignationType : ${T(maint.enums.WeekDesignationType).values()}">
                                            <input type="radio" name="weekDesignationType" th:id="weekDesignationType__${weekDesignationType.value}__" th:value="${weekDesignationType.value}"
                                                   th:checked="${weekDesignationType.value} eq *{weekDesignationType}" disabled/>
                                            <label class="inner-title" th:for="weekDesignationType__${weekDesignationType.value}__" th:text="${weekDesignationType.text}"></label>
                                        </th:block>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-1 control-label" style="width: 200px;"><span class="form-item-name">曜日区分</span></label>
                                <div class="col-md-9">
                                    <div class="weekday-row col-md-12"
                                         style="display:flex; flex-wrap:nowrap; gap:14px; align-items:center; line-height:1;">
                                           <span style="display:inline-flex; align-items:center; gap:6px; height:28px;">
                                             <input type="checkbox" id="sunday" th:field="*{sunday}" style="margin:0; vertical-align:middle;" disabled/>
                                             <label for="sunday" style="margin:0; line-height:1.2; font-weight:400; vertical-align:middle;">日曜</label>
                                           </span>
                                           <span style="display:inline-flex; align-items:center; gap:6px; height:28px;">
                                             <input type="checkbox" id="monday" th:field="*{monday}" style="margin:0; vertical-align:middle;" disabled/>
                                             <label for="monday" style="margin:0; line-height:1.2; font-weight:400; vertical-align:middle;">月曜</label>
                                           </span>
                                           <span style="display:inline-flex; align-items:center; gap:6px; height:28px;">
                                             <input type="checkbox" id="tuesday" th:field="*{tuesday}" style="margin:0; vertical-align:middle;" disabled/>
                                             <label for="tuesday" style="margin:0; line-height:1.2; font-weight:400; vertical-align:middle;">火曜</label>
                                           </span>
                                           <span style="display:inline-flex; align-items:center; gap:6px; height:28px;">
                                             <input type="checkbox" id="wednesday" th:field="*{wednesday}" style="margin:0; vertical-align:middle;" disabled/>
                                             <label for="wednesday" style="margin:0; line-height:1.2; font-weight:400; vertical-align:middle;">水曜</label>
                                           </span>
                                           <span style="display:inline-flex; align-items:center; gap:6px; height:28px;">
                                             <input type="checkbox" id="thursday" th:field="*{thursday}" style="margin:0; vertical-align:middle;" disabled/>
                                             <label for="thursday" style="margin:0; line-height:1.2; font-weight:400; vertical-align:middle;">木曜</label>
                                           </span>
                                           <span style="display:inline-flex; align-items:center; gap:6px; height:28px;">
                                             <input type="checkbox" id="friday" th:field="*{friday}" style="margin:0; vertical-align:middle;" disabled/>
                                             <label for="friday" style="margin:0; line-height:1.2; font-weight:400; vertical-align:middle;">金曜</label>
                                           </span>
                                           <span style="display:inline-flex; align-items:center; gap:6px; height:28px;">
                                             <input type="checkbox" id="saturday" th:field="*{saturday}" style="margin:0; vertical-align:middle;" disabled/>
                                             <label for="saturday" style="margin:0; line-height:1.2; font-weight:400; vertical-align:middle;">土曜</label>
                                           </span>
                                           <span style="display:inline-flex; align-items:center; gap:6px; height:28px;">
                                             <input type="checkbox" id="holiday" th:field="*{holiday}" style="margin:0; vertical-align:middle;" disabled/>
                                             <label for="holiday" style="margin:0; line-height:1.2; font-weight:400; vertical-align:middle;">祝日</label>
                                           </span>
                                    </div>
                                </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-1 control-label" style="width: 200px;"> <span class="form-item-name">利用区分</span></label>
                                <div class="col-md-9">
                                    <div class="radio col-md-12">
                                        <th:block th:each="flg : ${T(maint.enums.UsageDivision).values()}">
                                            <input type="radio" name="availableFlag" th:id="avFlg__${flg.value}__" th:value="${flg.value}"
                                                   th:checked="${flg.value} == (*{availableFlag} != null ? *{availableFlag} : '1')" th:classappend="${#fields.hasErrors('availableFlag')} ? 'error' : ''" disabled />
                                            <label class="inner-title" th:for="avFlg__${flg.value}__" th:text="${flg.text}" disabled ></label>
                                        </th:block>
                                    </div>
                                </div>
                            </div>
                            <div class="calendar-scroll-wrapper">
                                <label style="display:inline-block; font-weight:700; font-size:12px; line-height:1.2; margin:8px 0;">
                                  運行除外日設定
                                </label>
                                <table class="table table-striped table-bordered table-exclusions">
                                    <thead>
                                        <tr role="row">
                                            <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行除外日</th><th style="width: 80px;">削除</th>
                                            <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行除外日</th><th style="width: 80px;">削除</th>
                                            <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行除外日</th><th style="width: 80px;">削除</th>
                                            <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行除外日</th><th style="width: 80px;">削除</th>
                                            <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行除外日</th><th style="width: 80px;">削除</th>
                                            <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行除外日</th><th style="width: 80px;">削除</th>
                                            <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行除外日</th><th style="width: 80px;">削除</th>
                                        </tr>
                                    </thead>
                                    <tbody id="cancelDateTbody" style="word-break: break-all;"
                                           th:with="size=${#lists.size(calendarsDetailForm.calendarCancelDateList)}">
                                        <tr th:if="${size == 0}" role="row" class="odd">
                                            <th:block th:each="c : ${#numbers.sequence(0,6)}">
                                                <td>
                                                    <input type="hidden"
                                                        th:name="${'calendarCancelDateList['+c+'].calendarCancelDateId'}"
                                                        value="" disabled>
                                                </td>
                                                <td>
                                                    <input type="text"
                                                        th:name="${'calendarCancelDateList['+c+'].operationCancelDate'}"
                                                        maxlength="6" placeholder="yymmdd" style="width: 80px;" disabled/>
                                                </td>
                                                <td>
                                                    <input type="checkbox"
                                                    th:name="${'calendarCancelDateList['+c+'].delete'}" disabled/>
                                                </td>
                                            </th:block>
                                        </tr>
                                        <th:block th:if="${size > 0}" th:with="last=${size - 1}">
                                            <th:block th:each="start : ${#numbers.sequence(0, last)}">
                                                <tr th:if="${start % 7 == 0}" role="row" class="odd">
                                                    <th:block th:each="c : ${#numbers.sequence(0,6)}"
                                                        th:with="idx=${start + c}">
                                                        <td th:if="${idx < size}">
                                                            <input type="hidden" th:field="*{calendarCancelDateList[__${idx}__].calendarCancelDateId}">
                                                            <span th:text="*{calendarCancelDateList[__${idx}__].calendarCancelDateId}"></span>
                                                        </td>
                                                        <td th:if="${idx < size}">
                                                            <input type="text" th:field="*{calendarCancelDateList[__${idx}__].operationCancelDate}"
                                                                   maxlength="6" placeholder="yymmdd" style="width: 80px;" disabled/>
                                                        </td>
                                                        <td th:if="${idx < size}">
                                                            <input type="checkbox" th:field="*{calendarCancelDateList[__${idx}__].delete}" disabled/>
                                                        </td>
                                                        <td th:if="${idx >= size}">
                                                            <input type="hidden" th:name="${'calendarCancelDateList['+idx+'].calendarCancelDateId'}" value="">
                                                        </td>
                                                        <td th:if="${idx >= size}">
                                                            <input type="text" th:name="${'calendarCancelDateList['+idx+'].operationCancelDate'}"
                                                                   maxlength="6" placeholder="yymmdd" style="width: 80px;" disabled/>
                                                        </td>
                                                        <td th:if="${idx >= size}">
                                                            <input type="checkbox" th:name="${'calendarCancelDateList['+idx+'].delete'}" disabled/>
                                                        </td>
                                                    </th:block>
                                                </tr>
                                            </th:block>
                                        </th:block>
                                    </tbody>
                                </table>
                                <label style="display:inline-block; font-weight:700; font-size:12px; line-height:1.2; margin:8px 0;">
                                    運行指定日設定
                                </label>
                                <table class="table table-striped table-bordered table-exclusions">
                                    <thead>
                                        <tr role="row">
                                            <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行指定日</th><th style="width: 80px;">削除</th>
                                            <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行指定日</th><th style="width: 80px;">削除</th>
                                            <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行指定日</th><th style="width: 80px;">削除</th>
                                            <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行指定日</th><th style="width: 80px;">削除</th>
                                            <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行指定日</th><th style="width: 80px;">削除</th>
                                            <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行指定日</th><th style="width: 80px;">削除</th>
                                            <th style="min-width: 60px;">ID</th><th style="width: 80px;">運行指定日</th><th style="width: 80px;">削除</th>
                                        </tr>
                                    </thead>
                                    <tbody style="word-break: break-all;" th:with="size=${#lists.size(calendarsDetailForm.calendarDesignatedDateList)}">
                                        <tr th:if="${size == 0}" role="row" class="odd">
                                            <th:block th:each="c : ${#numbers.sequence(0,6)}">
                                                <td>
                                                    <input type="hidden"
                                                           th:name="${'calendarDesignatedDateList['+c+'].calendarDesignatedDateId'}"
                                                           value="" disabled>
                                                    <span></span>
                                                </td>
                                                <td>
                                                    <input type="text"
                                                           th:name="${'calendarDesignatedDateList['+c+'].operationDesignatedDate'}"
                                                           maxlength="6" placeholder="yymmdd" style="width: 80px;" disabled/>
                                                </td>
                                                <td>
                                                    <input type="checkbox"
                                                           th:name="${'calendarDesignatedDateList['+c+'].delete'}" disabled/>
                                                </td>
                                            </th:block>
                                        </tr>
                                        <th:block th:if="${size > 0}" th:with="last=${size - 1}">
                                            <th:block th:each="start : ${#numbers.sequence(0, last)}">
                                                <tr th:if="${start % 7 == 0}" role="row" class="odd">
                                                    <th:block th:each="c : ${#numbers.sequence(0,6)}"
                                                              th:with="idx=${start + c}">
                                                        <td th:if="${idx < size}">
                                                            <input type="hidden" th:field="*{calendarDesignatedDateList[__${idx}__].calendarDesignatedDateId}">
                                                            <span th:text="*{calendarDesignatedDateList[__${idx}__].calendarDesignatedDateId}"></span>
                                                        </td>
                                                        <td th:if="${idx < size}">
                                                            <input type="text" th:field="*{calendarDesignatedDateList[__${idx}__].operationDesignatedDate}"
                                                                   maxlength="6" placeholder="yymmdd" style="width: 80px;" disabled/>
                                                        </td>
                                                        <td th:if="${idx < size}">
                                                            <input type="checkbox" th:field="*{calendarDesignatedDateList[__${idx}__].delete}" disabled/>
                                                        </td>

                                                        <td th:if="${idx >= size}">
                                                            <input type="hidden" th:name="${'calendarDesignatedDateList['+idx+'].calendarDesignatedDateId'}" value="">
                                                            <span></span>
                                                        </td>
                                                        <td th:if="${idx >= size}">
                                                            <input type="text" th:name="${'calendarDesignatedDateList['+idx+'].operationDesignatedDate'}"
                                                                   maxlength="6" placeholder="yymmdd" style="width: 80px;" disabled/>
                                                        </td>
                                                        <td th:if="${idx >= size}">
                                                            <input type="checkbox" th:name="${'calendarDesignatedDateList['+idx+'].delete'}" disabled/>
                                                        </td>
                                                    </th:block>
                                                </tr>
                                            </th:block>
                                        </th:block>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                        <div class="panel-footer">
                            <div class="pull-right">
                                <form class="form-horizontal" method="post" th:action="@{#}">
                                    <input type="hidden" name="originSessionKey" th:value="*{sessionKey}">
                                    <input type="hidden" th:field="*{page}">
                                    <a th:if="*{dispMode.value} eq '3'" th:href="'/operation/calendars/' + *{page} + '/'" class=" btn btn-default" style="margin-right: 8px;">戻る</a>
                                    <button type="button" th:if="*{dispMode.value} neq '3'" th:formaction="@{/operation/calendars/detail/back/}" class="btn btn-default double-click" style="margin-right: 8px;">戻る</button>
                                    <button type="button" th:if="*{dispMode.value} neq '3'" class="btn btn-primary pull-right double-click" th:formaction="@{/operation/calendars/detail/register/}"
                                            th:text="*{dispMode.value} neq '1' ? '登録' : '変更'">登録</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <th:block th:insert="~{common/script :: common_script}"></th:block>
        <style>
            @media (max-width: 991px) {
                .panel .panel-heading,
                .panel .panel-footer,
                .panel .panel-body {
                    width: 100% !important;
                    max-width: 100% !important;
                    box-sizing: border-box;
                }
            }
        </style>
    </div>
    <!-- end: contents -->
</body>
</html>
