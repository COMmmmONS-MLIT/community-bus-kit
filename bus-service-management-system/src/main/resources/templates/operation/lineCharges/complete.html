<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}" th:with="title='運賃完了'">

<body>
<!-- start: contents -->
<div layout:fragment="main_contents" th:object="${lineChargeDetailForm}">
  <!-- PAGE CONTENT WRAPPER -->
  <div class="page-content-wrap">
    <div class="row">
      <div class="col-md-12">
        <div class="panel panel-default">
          <div class="panel-heading">
            <h3 class="panel-title">
              <!-- エラーメッセージがある場合のみ失敗を表示 -->
              <div th:if="${errorMessages != null && !errorMessages.isEmpty()}">
                <strong th:text="運賃__*{dispMode.text}__失敗">運賃登録失敗</strong>
              </div>
              <!-- エラーメッセージがない場合は常に完了を表示 -->
              <div th:if="${errorMessages == null || errorMessages.isEmpty()}">
                <strong th:text="運賃__*{dispMode.text}__完了">運賃登録完了</strong>
              </div>
            </h3>
          </div>
          <!-- START メッセージ表示部 -->
          <div th:if="${errorMessages}" th:replace="~{common/message :: common_message_box('danger', ${errorMessages})}"></div>
          <div th:unless="${errorMessages}" th:replace="~{common/message :: common_message_box('success', ${successMessages})}"></div>
          <!-- END メッセージ表示部 -->
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-12">
    <button class="btn btn-info btn-block btn-lg" th:onclick="'document.location.href = \'/operation/lineCharges/' + *{page} + '/\';'">運賃一覧に戻る</button>
  </div>

  <!-- END PAGE CONTENT WRAPPER -->
  <th:block th:insert="~{common/script :: common_script}"></th:block>
</div>
<!-- end: contents -->

</body>

</html>
