<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{common/layout}"
      th:with="title='運賃管理'">
<body>
<!-- start: contents -->
<div layout:fragment="main_contents" th:object="${lineChargeSearchForm}">
    <!-- PAGE CONTENT WRAPPER -->
    <div class="page-content-wrap">
        <div class="row">
            <div class="col-md-12">
                <div class="panel panel-default">
                    <form method="post" th:action="@{#}" class="form-horizontal" onkeydown="return event.key !== 'Enter';">
                        <div class="panel-heading">
                            <h3 class="panel-title">
                                <strong>運賃一覧</strong>
                            </h3>
                        </div>
                        <!-- START メッセージ表示部 -->
                        <div th:replace="~{common/message :: common_message_box('success',${successMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('danger',${errorMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('warning',${warningMessages})}"></div>
                        <!-- END メッセージ表示部 -->
                        <div class="panel-body">
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="col-md-1 control-label"><span class="badge badge-danger"></span> <span class="form-item-name">路線名</span></label>
                                        <div class="col-md-9">
                                            <div class="input-group col-md-12 div-flex" style="width: 300px;">
                                                <select id="agencySelect" class="form-control select2" th:field="*{rosenId}" th:classappend="${#fields.hasErrors('rosenId')} ? 'error' : ''">
                                                    <option value="">------------</option>
                                                    <option th:each="line : ${lineList}" th:value="${line.rosenId}" th:text="${line.rosenName}"></option>
                                                </select>
                                            </div>
                                            <span th:if="${#fields.hasErrors('rosenId')}" th:errors="*{rosenId}" class="text-danger" ></span>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                        <label class="col-md-1 control-label"><span class="badge badge-danger"></span> <span class="form-item-name">運賃改定名称</span></label>
                                        <div class="col-md-9">
                                            <div class="input-group col-md-12 div-flex">
                                                <input type="text" th:field="*{revisionReason}" class="form-control" maxlength="50" style="width: 300px;"
                                                       th:classappend="${#fields.hasErrors('revisionReason')} ? 'error' : ''" />
                                                <div><span class="help-block text-danger" style="width: 100px;">※部分一致</span></div>
                                            </div>
                                            <span th:if="${#fields.hasErrors('revisionReason')}" th:errors="*{revisionReason}" class="text-danger" ></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-group">
                                        <label class="col-md-1 control-label"><span class="badge badge-danger"></span> <span class="form-item-name">利用期間</span></label>
                                        <div class="col-md-9">
                                            <div class="d-flex align-items-center">
                                                <input class="form-control w-auto" type="date" th:field="*{serviceStartDate}" max="9999-12-31"
                                                       th:classappend="${#fields.hasErrors('serviceStartDate')} ? 'error' : ''" />
                                                <span class="mx-2"> ～ </span>
                                                <input class="form-control w-auto" type="date" th:field="*{serviceEndDate}" max="9999-12-31"
                                                       th:classappend="${#fields.hasErrors('serviceEndDate')} ? 'error' : ''" />
                                            </div>
                                        </div>
                                    </div>
                                    <div class="form-group">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="panel-footer">
                            <div style="display: flex;" class="pull-right">
                                <button type="submit" style="margin-left: 10px;" class="btn btn-primary btn-submit" th:formaction="@{/operation/lineCharges/}">
                                    <i class="fa fa-search" aria-hidden="true"></i>検索
                                </button>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="panel panel-default">
                    <div class="panel-body">
                        <table class="table table-striped table-bordered">
                            <thead>
                            <tr role="row">
                                <th style="width: 60px;">ID</th>
                                <th>路線名</th>
                                <th>運賃改定期間</th>
                                <th>運賃改定名称</th>
                                <th style="width: 80px;">操作</th>
                            </tr>
                            </thead>
                            <tbody th:if="${pager} neq null" style="word-break: break-all;">
                            <tr role="row" class="odd" th:each="lineCharge : ${pager.list}">
                                <td th:text="${lineCharge.chargeRevisionId}">1</td>
                                <td th:text="${lineCharge.rosenName}">路線名</td>
                                <td th:text="${#strings.replace(lineCharge.serviceStartDate, '-', '/')
                                  + ' ～ ' + #strings.replace(lineCharge.serviceEndDate, '-', '/')}">2025/08/08 ~ 9999/12/31</td>
                                <td th:text="${lineCharge.revisionReason}">運賃改定名称</td>
                                <td>
                                    <th:block th:if="${lineCharge.busStopCount >= 2}">
                                        <form th:if="${writeFlag}" method="post" th:action="@{/operation/lineCharges/detail/}">
                                            <input type="hidden" name="chargeRevisionId" th:value="${lineCharge.chargeRevisionId}" />
                                            <input type="hidden" name="page" th:value="*{page}" />
                                            <input type="hidden" name="insertFlag" th:value="${lineCharge.lineChargeId} == null ? 1 : 0" />
                                            <button type="submit" class="btn btn-sm double-click" th:classappend="${lineCharge.lineChargeId} == null ? ' btn-danger' : ' btn-info'"
                                                    th:text="${lineCharge.lineChargeId} == null ? '登録' : '変更'">登録</button>
                                        </form>
                                        <form th:if="${!writeFlag}" method="post" th:action="@{/operation/lineCharges/detail/content/}">
                                            <input type="hidden" name="chargeRevisionId" th:value="${lineCharge.chargeRevisionId}" />
                                            <input type="hidden" name="page" th:value="*{page}" />
                                            <button type="submit" class="btn btn-info btn-sm double-click">確認</button>
                                        </form>
                                    </th:block>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <div th:replace="~{common/paginate :: pagination('/operation/lineCharges/',${pager})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <th:block th:insert="~{common/script :: common_script}"></th:block>
</div>
<!-- END PAGE CONTENT WRAPPER -->
</body>
</html>
