<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}" th:with="title='系統管理'">
<body>
<!-- start: contents -->
<div layout:fragment="main_contents" th:object="${lineRoutesDetailForm}">
  <!-- PAGE CONTENT WRAPPER -->
  <div class="page-content-wrap">
    <div class="row">
      <div class="col-md-12">
        <div class="panel panel-default">
          <div class="panel-heading">
            <h3 class="panel-title">
              <div th:if="${errorMessage}">
                <strong th:text="系統__*{dispMode.text}__失敗">系統登録失敗</strong>
              </div>
              <div th:unless="${errorMessage}">
                <strong th:text="系統__*{dispMode.text}__完了">系統登録完了</strong>
              </div>
            </h3>
          </div>

          <!-- START メッセージ表示部 -->
          <div th:if="${errorMessage}" th:replace="~{common/message :: common_message_box('danger', ${errorMessage})}"></div>
          <div th:unless="${errorMessage}" th:replace="~{common/message :: common_message_box('success', ${successMessages})}"></div>
          <!-- END メッセージ表示部 -->
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-12">
    <button class="btn btn-info btn-block btn-lg" th:onclick="'document.location.href = \'/operation/lineRoutes/' + *{page} + '/\';'">系統一覧に戻る</button>
  </div>

  <!-- END PAGE CONTENT WRAPPER -->
  <th:block th:insert="~{common/script :: common_script}"></th:block>
</div>
<!-- end: contents -->

</body>
</html>
