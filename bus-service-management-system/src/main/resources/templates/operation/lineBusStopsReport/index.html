<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{common/layout}"
      th:with="title='停留所情報インポート'">
<body>
<!-- start: contents -->
<div layout:fragment="main_contents" th:object="${lineBusStopsReportListsExcelForm}">
    <!-- PAGE CONTENT WRAPPER -->
    <div class="page-content-wrap">
        <div class="row">
            <div class="col-md-12">
                <div class="panel panel-default">
                    <form method="post" th:action="@{/operation/lineBusStopsReport/downloadExcel}" class="form-horizontal">
                        <div class="panel-heading">
                            <h3 class="panel-title">
                                <strong>停留所情報インポート</strong>
                            </h3>
                        </div>
                        <!-- START メッセージ表示部 -->
                        <div th:replace="~{common/message :: common_message_box('success',${successMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('danger',${errorMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('warning',${warningMessages})}"></div>

                        <div class="panel panel-default">
                            <div class="panel-body">
                                <div th:if="${downloadFlag}">
                                    <div class="form-group">
                                        <label class="col-md-1 control-label" style="width: 130px;">
                                            <span class="form-item-name">雛形ダウンロード</span>
                                        </label>
                                        <div class="col-md-10">
                                            <button type="submit" class="btn btn-primary">DOWNLOAD</button>
                                        </div>
                                    </div>
                                </div>
                                <div class="form-group">
                                    <div th:if="${!writeFlag}" class="col-md-10">
                                        書込み権限がないため使用できません。
                                    </div>
                                    <div th:if="${writeFlag}" class="col-md-10">
                                        <div class="input-group col-md-11 div-flex">
                                            <div class="input-group col-md-11 div-flex">
                                                <label for="fileInput" class="btn btn-success" style="margin-right:6px;">停留所選択</label>
                                                <input type="file" id="fileInput" name="excel_file" accept=".xlsx"
                                                       style="position:absolute; left:-9999px;"
                                                       onchange="document.getElementById('selectedFileName').value = (this.files && this.files[0] ? this.files[0].name : (this.value ? this.value.split('\\').pop().split('/').pop() : ''))">
                                                <input type="text" id="selectedFileName" class="form-control" style="width:300px;" readonly placeholder="選択されたファイル名を表示します">
                                                <button type="button"
                                                        id="btnUploadAjax"
                                                        class="btn btn-success"
                                                        style="margin-left: 5px">
                                                    UPLOAD
                                                </button>
                                            </div>
                                        </div>
                                        <div style="flex-basis:100%; height:0;"></div>
                                        <div id="uploadErrorBox" class="text-danger"
                                             style="display:none; margin-top:10px; flex-basis:100%; width:100%;">
                                            <ul id="uploadErrorList" style="margin:0;"></ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <th:block th:insert="~{common/script :: common_script}"></th:block>
    <script th:inline="javascript">
        /*<![CDATA[*/
        document.querySelector('input[name="excel_file"]').addEventListener('change', function(){
            var f = this.files && this.files[0];
            if (f) document.getElementById('uploadFileName').value = f.name;
        });
        /*]]>*/
    </script>
    <script th:src="@{/js/operation/lineBusStopsReports/detail.js}"></script>
</div>
<!-- END PAGE CONTENT WRAPPER -->
</body>
</html>
