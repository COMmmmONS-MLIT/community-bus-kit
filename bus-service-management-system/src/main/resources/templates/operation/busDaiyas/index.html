<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{common/layout}" th:with="title='便ダイヤ管理'">

<body>
<!-- start: contents -->
<div layout:fragment="main_contents">
    <!-- PAGE CONTENT WRAPPER -->
    <div class="page-content-wrap">
        <div class="row">
            <div class="col-md-12">
                <form method="post" th:action="@{#}" class="form-horizontal" th:object="${busDaiyasSearchForm}"
                      onkeydown="return event.key !== 'Enter';">
                    <div class="panel panel-default">
                        <div class="panel-heading">
                            <h3 class="panel-title">
                                <strong>便ダイヤ一覧</strong>
                            </h3>
                        </div>
                        <!-- START メッセージ表示部 -->
                        <div th:replace="~{common/message :: common_message_box('success',${successMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('danger',${errorMessages})}"></div>
                        <div th:replace="~{common/message :: common_message_box('warning',${warningMessages})}"></div>
                        <!-- END メッセージ表示部 -->
                        <div class="panel-body">
                            <div class="form-group">
                                <label class="col-md-1 control-label"> <span class="badge badge-danger"></span>
                                    <span class="form-item-name">路線</span>
                                </label>
                                <div class="col-md-9">
                                    <select class="form-control select2" th:field="*{searchRosenId}">
                                        <option value="">-------</option>
                                        <option th:each="item : ${linesList}" th:value="${item.rosenId}" th:text="${item.rosenName}">
                                        </option>
                                    </select>
                                    <p th:if="${#fields.hasErrors('searchRosenId')}" th:errors="*{searchRosenId}" class="text-danger"></p>
                                </div>
                            </div>
                            <div class="form-group">
                                    <label class="col-md-1 control-label"><span class="badge badge-danger"></span> <span class="form-item-name">運行期間</span></label>
                                    <div class="col-md-9">
                                        <div class="d-flex align-items-center">
                                            <input class="form-control w-auto" type="date" th:field="*{searchServiceStartDate}" max="9999-12-31" th:classappend="${#fields.hasErrors('searchServiceStartDate')} ? 'error' : ''" />
                                            <span class="mx-2"> ～ </span>
                                            <input class="form-control w-auto" type="date" th:field="*{searchServiceEndDate}" max="9999-12-31" th:classappend="${#fields.hasErrors('searchServiceEndDate')} ? 'error' : ''" />
                                        </div>
                                    </div>
                            </div>
                            <div class="form-group">
                                <label class="col-md-1 control-label"><span class="badge badge-danger"></span>
                                    <span class="form-item-name">往復区分</span>
                                </label>
                                <div class="col-md-9">
                                    <div class="radio col-md-12">
                                        <input type="radio" name="searchLineDetailServiceDivisionFlg" th:id="searchLineDetailServiceDivisionFlg__0__" th:value="1" th:checked="*{searchLineDetailServiceDivisionFlg eq 1}"/>
                                        <label class="inner-title" th:for="searchLineDetailServiceDivisionFlg__0__" th:text="往路"></label>
                                        <input type="radio" name="searchLineDetailServiceDivisionFlg" th:id="searchLineDetailServiceDivisionFlg__1__" th:value="0" th:checked="*{searchLineDetailServiceDivisionFlg eq 0}"/>
                                        <label class="inner-title" th:for="searchLineDetailServiceDivisionFlg__1__" th:text="復路"></label>
                                    </div>
                                    <p th:if="${#fields.hasErrors('searchLineDetailServiceDivisionFlg')}" th:errors="*{searchLineDetailServiceDivisionFlg}" class="text-danger"></p>
                                </div>
                            </div>
                        </div>
                        </div>
                    <div class="panel-footer">
                        <div style="display: flex;" class="pull-right">
                            <button type="submit" style="margin-left: 10px;" class="btn btn-primary btn-submit" th:formaction="@{/operation/busDaiyas/}">
                                <i class="fa fa-search" aria-hidden="true"></i>検索
                            </button>
                        </div>
                    </div>
                </form>
                <div class="panel panel-default">
                    <div class="panel-body">
                        <table class="table table-striped table-bordered">
                            <colgroup>
                                <col style="width:5%;">
                                <col style="width:5%;">
                                <col style="width:30%;">
                                <col style="width:5%;">
                                <col style="width:20%;">
                                <col style="width:30%;">
                                <col style="width:5%;">
                            </colgroup>
                            <thead>
                            <tr role="row">
                                <th style="width: 60px;">便ダイヤID</th>
                                <th style="width: 60px;">路線ID</th>
                                <th style="width: 300px;">路線名</th>
                                <th style="width: 500px;">往復区分</th>
                                <th style="width: 200px;">運行期間</th>
                                <th style="width: 200px;">ダイヤ改正理由</th>
                                <th style="width: 100px;">操作</th>
                            </tr>
                            </thead>
                            <tbody th:if="${pager} neq null">
                            <tr th:each="busDaiyas : ${pager.list}" role="row" class="odd">
                                <td th:text="${busDaiyas.daiyaRevisionId}"></td>
                                <td th:text="${busDaiyas.rosenId}"></td>
                                <td th:text="${busDaiyas.rosenName}"></td>
                                <td th:text="${busDaiyas.lineDetailServiceDivision} eq '1' ? '往路':'復路'" ></td>
                                <td th:text="${busDaiyas.serviceStartDate + '～' + busDaiyas.serviceEndDate}"></td>
                                <td th:text="${busDaiyas.daiyaRevisionName}"></td>
                                <td>
                                    <form method="post" th:action="@{/operation/busDaiyas/detail/}">
                                        <input type="hidden" name="rosenId" th:value="${busDaiyas.rosenId}" />
                                        <input type="hidden" name="lineRouteId" th:value="${busDaiyas.lineRouteId}" />
                                        <input type="hidden" name="daiyaRevisionId" th:value="${busDaiyas.daiyaRevisionId}" />
                                        <input type="hidden" name="lineDetailServiceDivision" th:value="${busDaiyas.lineDetailServiceDivision}" />
                                        <input type="hidden" name="page" th:value="${busDaiyasSearchForm.page}" />
                                        <button th:if="${writeFlag}" type="submit" class="btn btn-info btn-sm double-click" th:formaction="@{/operation/busDaiyas/detail/}">変更</button>
                                        <button th:if="!${writeFlag}" type="submit" class="btn btn-info btn-sm double-click" th:formaction="@{/operation/busDaiyas/detail/content/}">確認</button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <div th:replace="~{common/paginate :: pagination('/operation/busDaiyas/',${pager})}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:insert="~{common/modal :: customDialog}"></div>
    <th:block th:insert="~{common/script :: common_script}"></th:block>

</div>
<!-- END PAGE CONTENT WRAPPER -->
</body>

</html>
